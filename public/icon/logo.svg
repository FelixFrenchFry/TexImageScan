<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 128 128" fill="none">
  <title>TexImageScan logo</title>
  <desc>A full-bleed solid dark obsidian badge with an intense cyan laser beam sweeping across, revealing an illuminated white radical. Zero empty margins.</desc>
  <defs>
    <clipPath id="badge-clip">
      <rect x="0" y="0" width="128" height="128" rx="24"/>
    </clipPath>
  </defs>
  <!-- full-bleed 100% edge-to-edge badge with tight rounding -->
  <rect id="badge" x="0" y="0" width="128" height="128" rx="24" fill="#052723"/>
  <g id="laser" clip-path="url(#badge-clip)">
    <polygon id="laser-glow" points="-10,54 138,34 138,76 -10,96" fill="#14B8A6" opacity="0.45"/>
    <line id="laser-core" x1="-10" y1="75" x2="138" y2="55" stroke="#2DD4BF" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- sized to maximize footprint and clarity -->
  <path id="root" d="M26 68 L44 98 L76 30 H104" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
